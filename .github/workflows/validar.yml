name: Validar datos
on:
  push:
    paths:
      - "data/**"
      - ".github/scripts/validate.mjs"
      - ".github/workflows/validar.yml"
  pull_request:
    paths:
      - "data/**"
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar archivos de data/
        run: node .github/scripts/validate.mjs